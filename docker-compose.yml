services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
      - ./schemas:/app/schemas
    environment:
      - MOCK_LLM=true
      - DATA_DIR=/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8081

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host
